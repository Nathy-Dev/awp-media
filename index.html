<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the safe-area insets below actually apply on notched iPhones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A192F" />

    <title>Apostles of the Word and Prayer Worldwide</title>
    <meta
      name="description"
      content="Apostles of the Word and Prayer Worldwide - A fellowship of believers in Christ alone. Teaching, evangelism, prayer, and full demonstration of the Spirit are our focus."
    />
    <meta name="author" content="Apostles of the Word and Prayer Worldwide" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" href="/images/awp-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/awp-logo-192x192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Warm the connection to archive.org: every cover and audio file comes from there. -->
    <link rel="preconnect" href="https://archive.org" />
    <link rel="dns-prefetch" href="https://archive.org" />

    <!--
      No stylesheet links here on purpose. The previous build loaded all of Font
      Awesome (a render-blocking third-party request, for about twenty icons)
      plus three no-store cache meta tags on every page. Icons are now inline
      SVG in src/components/Icon.tsx and caching is set in vercel.json.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
